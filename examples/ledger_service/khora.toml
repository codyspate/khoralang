[package]
name = "ledger_service"
version.workspace = true

# What this program may reach outside itself.
#
# The database is a *package*, not `std`, so nothing here declares an
# `extern fn` and there is no `[permissions] extern` entry. What it does need
# is the network — for the port it answers on and for the one it dials
# PostgreSQL on. `docs/design/permissions.md`.
[permissions]
network = ["0.0.0.0:8080", "127.0.0.1:5433"]
env = ["PORT", "PGHOST", "PGPORT", "PGUSER", "PGDATABASE", "PGPASSWORD", "POOL"]

[dependencies]
postgres = { path = "../../packages/postgres" }

# The repository's formatter settings, from `[workspace.fmt]` in the root.
[fmt]
workspace = true
