[package]
name = "risk_analyzer"
version.workspace = true
authors = ["Engineering Team <dev@khora.internal>"]

# What this program may reach outside itself.
#
# The manifest decides which capabilities the program may *hold*, and that half
# is checked when it is compiled. What may be done with one — which host, which
# path — is checked where the access happens, because a host read out of a
# config file cannot be checked any earlier. `docs/design/permissions.md`.
#
# A missing table grants everything: nothing here is a tax on getting started.
[permissions]
network = ["0.0.0.0:47821", "*.internal:5432"]
env = ["DB_*"]

[permissions.fs]
read = ["/etc/config", "./data/**"]
write = ["./tmp/**"]

# The repository's formatter settings, from `[workspace.fmt]` in the root.
[fmt]
workspace = true

# `unused-capability`, singular. It was `unused-capabilities` here, which is not
# a lint, so the strictest setting in the repository's most-read example had
# been doing nothing. `khora check` says so -- "is not a lint, so it does
# nothing" -- and the warning was scrolling past above a clean result.
#
# `cyclomatic-complexity` went with it rather than being corrected: there is no
# such lint to correct it to. Configuring one that does not exist is how a
# manifest comes to describe a policy nobody is keeping.
[lints]
unused-capability = "deny"

# `std` is not here: the standard library is found beside the compiler, the way
# `rustc` finds its sysroot. A line every package repeats and none can get
# wrong is not a line worth writing.
#
# `ai` is here for the opposite reason. It was `std::ai` and is a package now --
# `packages/ai/src/llm.kh` has the argument -- so the program that uses a model
# says which model vocabulary it agreed to, exactly as `ledger_service` names
# `postgres`.
[dependencies]
ai = { path = "../../packages/ai" }

# Sandboxed WASM build plugins replace arbitrary build.rs execution.
[build]
target = "x86_64-unknown-linux-musl"
plugin = "protobuf-compiler@2.1"

[tasks.ci]
description = "Run the full CI pipeline"
depends_on = ["lint", "test", "build"]
