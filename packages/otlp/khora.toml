[package]
name = "otlp"
version.workspace = true
edition.workspace = true
# Offered for other people to depend on, like `postgres`: an exporter is the
# one thing every service needs and the one thing `std::trace` deliberately
# will not carry.
publish = true

# Everything here reaches the world through `std::net::http` and `std::clock`,
# both of which are `std`'s to declare. Nothing here declares an `extern fn` of
# its own, so this package needs no entry in the parent's `[permissions] extern`
# list -- see `docs/design/permissions.md`.
