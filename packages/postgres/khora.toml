[package]
name = "postgres"
version.workspace = true
# Offered for other people to depend on. Absent means no: a pushed repository
# is already fetchable, so the active choice is the one written down, and this
# repository is mostly a compiler with one library in it.
#
# Not inherited, and it is the clearest case for why inheritance is opt-in:
# exactly one thing in this repository is a library, and a root that said
# `publish = true` for everybody would advertise the benchmarks.
publish = true

# A driver reaches the operating system through `std::net::socket`, which is
# `std`'s to declare. The `extern fn`s this package declares itself are the
# runtime's clock and counters, used by `conn.kh` and its tests, so a
# dependent whose `[permissions]` says `default = "deny"` lists this package
# under `extern` -- see `docs/design/permissions.md`.
