# How `cargo nextest` should run this suite.
#
# nextest gives each test its own process and runs many at once, where
# `cargo test` runs one binary at a time and parallelises only inside it. That
# is most of the speed-up and it breaks two kinds of test here.

# Tests that start a server and then measure how it behaves need the machine.
# `a_server_under_more_load_than_it_can_serve_answers_everybody` asserts that
# twenty-four clients overlapped; under nextest's default parallelism its
# client threads were starved by sixteen other test processes and arrived one
# at a time, so the server never saw two at once and the test correctly refused
# to pass. The guard did its job — this is how it is given what it needs.
[[profile.default.overrides]]
# **The name gained a module prefix and this is an *exact* match.** The tests of
# `khora-codegen-llvm` were sixty-eight binaries and are modules of one now, so
# this test is `load::a_server_...` rather than `a_server_...`. The filter went
# on matching nothing, the reservation stopped applying, and the test was
# starved by the rest of the workspace and refused to pass -- which is the guard
# below doing its job, reported as a failure of the thing it protects.
#
# It survived a push because it only appears under the whole workspace's
# parallelism; `-p khora-codegen-llvm` alone never has enough running to starve
# it. `scripts/baseline.sh` is the thing that catches this.
filter = 'test(=load::a_server_under_more_load_than_it_can_serve_answers_everybody)'
threads-required = 'num-test-threads'

# The two reactor tests that time a registration against a poll already in
# flight. Each starts a poll on one thread, sleeps 5 ms on another, and only
# judges a round that registered within 10 ms of the poll beginning; a round
# that didn't is repeated, fifty times, and then the test refuses to pass
# rather than pass vacuously. Under the whole workspace on a three-core macOS
# runner, those 5 ms sleeps overran to about 50 ms in every round, so neither
# test ever got a round it could judge. It is the load guard above again: the
# test needs the machine, and says so when it doesn't get it.
[[profile.default.overrides]]
filter = 'package(khora-rt) & (test(=reactor::tests::a_registration_during_a_poll_is_seen_by_that_poll) | test(=reactor::tests::a_deadline_registered_during_a_poll_is_honoured_by_that_poll))'
threads-required = 'num-test-threads'

# Everything that binds a socket, kept to a few at a time. The ports are all
# distinct, so this is not about collisions: it is that a dozen servers and
# their clients on one machine make every one of them slow, and the timeouts
# these tests use to notice a hung server start firing on a healthy one.
[test-groups.networked]
max-threads = 4

# These named binaries, back when every file in `tests/` was its own
# executable. They are modules of one binary now --
# `crates/khora-codegen-llvm/tests/suite.rs` says why -- so the same set is
# named by the module a test's path starts with. `binary(...)` matched on
# substring, so `binary(http)` covered `http_layers` and `http_client` and
# `binary(tls)` covered `tls_cancel`; the two regexes keep exactly that.
[[profile.default.overrides]]
filter = '''
    test(/^http/) or test(/^tls/) or test(/^reference::/)
    or test(/^sockets::/) or test(/^postgres::/) or test(/^load::/)
'''
test-group = 'networked'
