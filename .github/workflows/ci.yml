name: ci

# **On demand only, deliberately.** This repository is private, and private
# Actions minutes bill with a multiplier: Linux x1, Windows x2, macOS x10. This
# workflow runs six jobs and the backend ones take ten to twenty-five minutes,
# so one green run costs on the order of 120 billed minutes -- most of it the
# macOS backend at x10. Nineteen pushes in a night exhausted the allowance, and
# every job then failed in three seconds with no steps, which looks like a
# broken workflow and is not.
#
# `sh scripts/baseline.sh` is the gate now: the whole suite, clippy with
# warnings denied, the corpus and formatter over `std`, every reference
# application built, and twelve HTTP conformance checks against a real `curl`.
#
# **What the local baseline cannot tell you**, and what this workflow found the
# first time it was able to run at all:
#
#   - `std` did not compile on Linux or macOS, because `std/fs` and the POSIX
#     socket files both declare `close` and `socket_windows.kh` does not;
#   - generated objects were not position-independent, so nothing linked on a
#     modern Linux;
#   - the macOS entry in `SYSTEM_LIBS` was a placeholder missing the
#     `CoreFoundation` and `Security` frameworks;
#   - `a_fiber_cancelled_before_it_starts_does_nothing` asserted a race it
#     could lose, which needs load to show.
#
# Two of those are now caught from any host by
# `khora-codegen-llvm/tests/portability.rs`, which generates and verifies a
# module for all three targets. The other two still need a real machine.
#
# **Run it before anything that matters** -- a release, a merge, a change to
# `khora-rt` or to code generation -- from the Actions tab, or:
#
#     gh workflow run ci.yml
#
# To go back to running on every push, put the `push` and `pull_request`
# triggers back. Consider dropping the macOS backend to a schedule first: it is
# a tenth of the wall clock and most of the bill.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that does not need LLVM, on all three platforms.
  #
  # This is the cheap job and it catches most of what a matrix is for. It also
  # runs `khora-types/tests/portability.rs`, which type-checks `std` for every
  # target from whichever host it happens to be on — so a mistake in
  # `socket_macos.kh` is a red tick here rather than a discovery by whoever next
  # builds on a Mac.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: check-${{ matrix.os }}

      # No LLVM here, so no `.cargo/config.toml` is needed — `setup-llvm.sh`
      # writes it and this job does not run it.
      - run: cargo build --workspace --all-targets

      # A prebuilt binary, not `cargo install`: this is the difference between
      # seconds and a compile of nextest itself on every runner. It pays for
      # itself either way — the workspace suite is 116s under nextest against
      # 271s under `cargo test`, which runs one test *binary* at a time.
      # `.config/nextest.toml` names the tests that cannot have a process each.
      # `tool:` is spelled out because the ref is a commit. This action
      # normally takes the tool from the tag it was called by --
      # `install-action@nextest` -- and pinning the ref throws that name away:
      # `inputs.tool` comes out empty, `main.sh` warns "no tool specified" and
      # then **exits 0** for backward compatibility. The step would pass, and
      # nextest would not be installed.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest
      - run: cargo nextest run --workspace
      # nextest drives libtest binaries and rustdoc does not produce one, so
      # the doctests are not in that run. Eleven seconds, and without it the
      # examples in the documentation stop being compiled at all.
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # No `cargo fmt --check`. This source is deliberately not rustfmt output —
      # running it rewrites some 2,200 lines — and the formatting that *is*
      # enforced is Khora's own, over `std`, `examples` and `bench`, in the
      # baseline below.

  # The backend, the standard library and the reference applications — the job
  # that finds out whether a socket actually binds.
  #
  # Separate because it needs LLVM 22.1.8, which is ~5 GB extracted on Windows.
  # `scripts/setup-llvm.sh` is the same script a person runs, so a failure here
  # is a failure of the documented install rather than of a CI-only path.
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: backend-${{ matrix.os }}

      # Only Windows downloads a tarball; the other two are a bottled brew
      # formula pinned at exactly 22.1.8.
      - name: Cache the Windows LLVM tarball
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.llvm
          key: llvm-22.1.8-${{ runner.os }}

      # Installs LLVM *and* writes `.cargo/config.toml` from the template,
      # which is where the static-CRT flag and the Windows SDK search path come
      # from. Both are needed on Windows and neither can be committed: the SDK
      # version differs per machine. `docs/llvm-setup.md` §3 has the why.
      #
      # This is the same script a person runs, so a failure here is a failure of
      # the documented install rather than of a CI-only path.
      - name: Install LLVM and write the cargo config
        shell: bash
        run: |
          prefix=$(sh scripts/setup-llvm.sh --quiet)

          # `$GITHUB_ENV` takes `KEY=value` one line at a time, so a
          # multi-line value is not an error here -- it is a confusing error
          # later, raised by the runner, quoting whichever line of the
          # install log it choked on. Say it plainly instead. The script
          # redirects its own stdout now so this should be unreachable; it
          # is here because the failure it names cost five red runs to
          # recognise. `printf %s` emits no trailing newline, so a count of
          # zero means exactly one line.
          if [ -z "$prefix" ]; then
            echo "setup-llvm printed nothing"; exit 1
          fi
          if [ "$(printf %s "$prefix" | wc -l)" -ne 0 ]; then
            echo "setup-llvm printed more than the prefix:"
            printf %s "$prefix" | head -20
            exit 1
          fi

          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"

      # The authoritative answer to "what does a generated program have to
      # link against on this platform", printed rather than guessed.
      #
      # `toolchain::SYSTEM_LIBS` has one list per platform and its doc comment
      # has always said this command is the only authority on the question. The
      # macOS list was nevertheless a placeholder that had never been run,
      # because nothing on a Mac had ever linked a Khora program. Printing it
      # here means the next disagreement is a diff in the log rather than a
      # page of undefined symbols.
      - name: What the runtime needs to link against
        shell: bash
        continue-on-error: true
        run: |
          cargo rustc -p khora-rt --crate-type staticlib -- --print native-static-libs 2>&1             | grep -A2 native-static-libs || true

      # Installed but not run here: `scripts/baseline.sh` prefers nextest when
      # it is on PATH and falls back to `cargo test` when it is not, so this
      # step is what decides whether the baseline below takes 116s or 271s over
      # the suite. The separate `cargo test --workspace --features llvm` that
      # used to stand here was the baseline's own first step run twice.
      # `tool:` is spelled out because the ref is a commit. This action
      # normally takes the tool from the tag it was called by --
      # `install-action@nextest` -- and pinning the ref throws that name away:
      # `inputs.tool` comes out empty, `main.sh` warns "no tool specified" and
      # then **exits 0** for backward compatibility. The step would pass, and
      # nextest would not be installed.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest

      # The whole baseline: the suite, clippy, the corpus check and formatter
      # over `std`, every reference application built, and twelve HTTP
      # conformance checks against a real `curl`. On Windows the script is
      # already what `scripts/baseline.sh` runs locally.
      - name: Baseline
        shell: bash
        run: sh scripts/baseline.sh
