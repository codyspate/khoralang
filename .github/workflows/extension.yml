name: extension

# Packages the VS Code extension and publishes it on a release of its own.
#
# **Separate from the toolchain, deliberately.** `release.yml` ships `khora`:
# three platform archives, built from the compiler, versioned with the
# language. The extension is JavaScript with no native code in it, it has its
# own version in `editors/vscode/package.json`, and it changes for its own
# reasons — a fix to hover rendering has nothing to do with a compiler release
# and should not wait for one, nor drag one along. Bundling them would mean a
# `.vsix` that is only ever as current as the last toolchain, and a toolchain
# release that cannot go out while the extension is mid-change.
#
# rustup and rust-analyzer are the same split for the same reason.
#
# The flow, which mirrors `release.yml` without sharing its tags:
#
#   1. Tag `vscode-v<version>`, matching `package.json`.
#   2. Push it. This runs, packages the `.vsix`, and creates the release.
#   3. Install with `code --install-extension`, or from VS Code's
#      "Install from VSIX".
#
# `vscode-` rather than `extension-`, because 14.11 wants Zed and the others
# eventually and each will want a series of its own.
#
# Until 14.12 puts this on the marketplace and OpenVSX, a release asset is the
# whole installation story. The publish steps at the end are written and
# skipped: each runs when its token exists as a repository secret --
# `VSCE_PAT` for the Visual Studio Marketplace, `OVSX_PAT` for Open VSX -- and
# the release asset goes out either way.

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, e.g. vscode-v0.3.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  package:
    name: package and publish
    runs-on: ubuntu-latest
    # **Job level, so the publish steps can ask whether they have a token.**
    # GitHub refuses `secrets` inside an `if`, and a step's own `env` is not in
    # scope for its own condition -- a job-level `env` is the one shape that
    # works. An absent secret is the empty string here, which is what makes
    # "publish where we can, always publish the release asset" expressible.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      # The tag, not the default branch. On a tag push those are the same
      # thing and the `ref` is redundant; on `workflow_dispatch` they are not,
      # and without this the run would package whatever `main` holds today and
      # publish it under a tag naming a different commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # **The tag has to agree with `package.json`.** VS Code shows the
      # version from the manifest whatever the file is called, so a tag that
      # says otherwise produces a release whose name is a lie about what
      # installs. Checked here rather than trusted, because the two are edited
      # in different places by different hands.
      - name: The tag and the manifest have to agree
        working-directory: editors/vscode
        run: |
          set -eu
          declared=$(node -p "require('./package.json').version")
          tagged=${TAG#vscode-v}
          if [ "$declared" != "$tagged" ]; then
            echo "The tag says $tagged and package.json says $declared."
            echo "Bump one of them; a release named for a version it does not"
            echo "contain is worse than no release."
            exit 1
          fi
          echo "version $declared"

      # `npm ci` rather than `npm install`: the lockfile is committed, and a
      # release should build what it says rather than what the registry has
      # today.
      - name: Package
        working-directory: editors/vscode
        run: |
          set -eu
          npm ci
          npm run package
          version=$(node -p "require('./package.json').version")
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv khora-lang.khora.vsix "$GITHUB_WORKSPACE/dist/khora-vscode-$version.vsix"

      # The one check worth having: a `.vsix` missing `extension.js` or the
      # language client installs cleanly and then does nothing, which is the
      # failure a user reports as "the extension is broken". `install.ps1`
      # produced exactly that package for a while.
      - name: It has to contain an extension
        run: |
          set -eu
          file=$(ls dist/*.vsix)
          unzip -l "$file" | grep -q "extension/src/extension.js" \
            || { echo "no extension.js in $file"; exit 1; }
          unzip -l "$file" | grep -q "vscode-languageclient" \
            || { echo "no language client in $file"; exit 1; }
          unzip -l "$file" | grep -q "extension/icon.png" \
            || { echo "no icon in $file: the gallery tile would be blank"; exit 1; }
          # **A build tool in the package is a shipped defect, not waste.**
          # `sharp` renders the icon and carries a platform-specific native
          # binary; installed on demand rather than declared, so `vsce` has no
          # dev-dependency entry to prune it by. It went from 487 KB to 8.7 MB
          # once, and a package built on one runner would carry another
          # platform's binary.
          if unzip -l "$file" | grep -qE "sharp|@img"; then
            echo "a build tool reached $file"; exit 1
          fi
          size=$(unzip -l "$file" | tail -1 | awk '{print $1}')
          # The package unpacks to about 1.8 MB, nearly all of it the language
          # client. Four is loose enough that a dependency growing does not
          # fail a release, and tight enough to catch the 8.7 MB the native
          # renderer made of it.
          if [ "$size" -gt 4000000 ]; then
            echo "$file unpacks to $size bytes, which is far more than an"
            echo "editor client needs; something is riding along"
            exit 1
          fi
          echo "$file looks like an extension"

      # **`--prerelease`, on a release that is not provisional.** The flag is
      # not a claim about the extension's quality; on GitHub it means "do not
      # treat this as the repository's headline release", and the repository's
      # headline release is the compiler.
      #
      # Publishing 0.3.0 without it is what caused errata 52: it became the
      # only non-pre-release here, so `/releases/latest` returned it, and every
      # installer that trusted that endpoint went looking for a compiler inside
      # an editor plugin. The installers no longer trust it -- they filter tags
      # themselves -- so this flag is belt and braces rather than the fix. It
      # earns its place anyway, because the copies of `khora update` already on
      # people's machines have the old resolver baked in and cannot be fixed
      # from here. Setting the flag repaired every one of them at once.
      #
      # Worth revisiting when there is a stable toolchain release: from that
      # point "latest" has an obviously right answer and this is only about the
      # badge. Until then it is load-bearing for anybody already installed.
      #
      # The notes are a file in the repository rather than a string in this
      # step. Shell quoting has corrupted committed text here before, and
      # release notes are prose, inside shell, inside YAML -- three layers of
      # escaping deep, and the corruption is only visible once it is published.
      # A file has none of that, and shows up in the diff that changes it.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          notes=editors/vscode/RELEASE.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.vsix --clobber
            gh release edit "$TAG" --notes-file "$notes" --prerelease
          else
            gh release create "$TAG" dist/*.vsix \
              --title "Khora for VS Code $TAG" \
              --prerelease \
              --notes-file "$notes"
          fi

      # **The two registries, each skipped when its token is absent.**
      #
      # A `.vsix` on a release is an installation story for somebody who
      # already knows the extension exists; it is not one for somebody typing
      # "khora" into the extensions pane, which is where every editor plugin is
      # actually found. Both steps are conditional rather than required so that
      # a release still succeeds before the credentials exist -- the GitHub
      # asset above is the floor, and these raise it when they can.
      #
      # `--packagePath` on the archive that was already built and checked,
      # rather than letting either tool package again: a registry copy built by
      # a different command is a different artifact, and then the thing people
      # install is not the thing the checks above passed.
      #
      # The condition reads a *job-level* `env`, which is the documented way:
      # GitHub refuses `secrets` inside an `if` outright, and a step's own
      # `env` is not in scope for its own condition. Both wrong shapes fail the
      # same silent way -- a skip indistinguishable from a missing token, which
      # would keep skipping after the credentials arrived.
      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath "$(ls dist/*.vsix)"

      # Open VSX is what VSCodium, Cursor, Gitpod and Eclipse Theia search.
      # Same artifact, different registry, and no Microsoft account involved.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish --packagePath "$(ls dist/*.vsix)"
