name: release

# Builds a toolchain per platform and attaches it to a release that already
# exists.
#
# The flow, and the order matters:
#
#   1. Push the reviewed tag, then create a draft release against that tag.
#      A draft created without a pushed tag has no immutable source to build.
#   2. This runs against the tag (also on workflow_dispatch), builds a toolchain
#      per platform, and uploads the artifacts to the draft.
#   3. Verify the run SHA and all archives against the tag, then publish.
#   4. For a stable release, open and merge the docs PR from the branch this
#      workflow pushes. RCs leave /docs/next/ in place.
#
# Only step 3 makes it visible to `install.sh`. So a half-built or wrong
# release is never something a `curl | sh` can reach: until somebody presses
# the button, the newest thing the installer can see is the previous one.
#
# **Candidates go out the same way with the pre-release box ticked.** A
# pre-release is published — installable by name, and with `install.sh --pre` —
# and the installers skip it unless asked, so it is testable without being what
# a plain `curl | sh` gets. Candidates are versions of their own,
# `v0.2.0-rc.1` then `-rc.2`; the stable release is `v0.2.0` cut from the same
# commit as the last candidate. Nothing is ever promoted in place, because a
# version number that changes meaning is worse than an extra tag.
#
# **`workflow_dispatch` is here because saving a draft may not fire anything.**
# GitHub's `release` webhook documents `created` as covering a saved draft, and
# Actions has historically been inconsistent about delivering release events
# for drafts. Rather than depend on it, the same job can be started by hand
# from the Actions tab with the tag as input — and that path is the one to use
# if step 1 produces no run.
#
# Artifacts are attached with `gh release upload`, which does not touch the
# release's draft state. `softprops/action-gh-release` would have been shorter
# and takes a `draft:` argument, which means a workflow that runs against an
# already-published release can quietly unpublish it. Not a risk worth the
# three lines it saves.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the draft release to attach to, e.g. v0.1.0"
        required: true
      alpine-only:
        description: >-
          Build and smoke-test only the Alpine toolchains, and attach nothing.
          For trying the Alpine jobs from a branch: the tag is then only the
          version the archives are named for.
        type: boolean
        default: false

# **Read by default, and write only where something is written.** This was
# `contents: write` for the whole workflow, which handed a token that can push
# commits and publish releases to every step in it -- including three
# third-party actions in `build`, which compiles Rust and produces files and
# has no business writing to the repository.
#
# Only `attach` uploads, so only `attach` has it. The third-party actions all
# live in `build`, and now run with a read-only token.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: package (${{ matrix.os }})
    if: ${{ !inputs.alpine-only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # **`ubuntu-latest` is what sets the Linux glibc floor, and it is the
        # highest one on offer.** A glibc program carries the symbol versions
        # of the machine that compiled it, so the runner chosen here decides
        # which machines the released toolchain can start on: `ubuntu-latest`
        # is Ubuntu 24.04, whose glibc is 2.39, and the 0.1.0 binary asks for
        # `GLIBC_2.39`. Debian 12 (2.36), Ubuntu 22.04 (2.35) and RHEL 9 (2.34)
        # cannot run it -- the current Debian stable and a supported LTS among
        # them.
        #
        # That is stated rather than hidden: `MIN_GLIBC` in `install.sh` is the
        # same number, the installer refuses below it instead of unpacking a
        # toolchain that cannot start, and `scripts/check-install.sh` installs
        # the published release inside those images and fails if the two ever
        # disagree. **Changing this line means changing that one**, and running
        # that script afterwards.
        #
        # Lowering the floor is a real option and deliberately not taken here
        # without a green run behind it: build the Linux artifact inside an
        # older container (`container: debian:bookworm-slim` on this job, with
        # the LLVM setup that image needs) rather than pinning an older runner
        # label, which GitHub retires. That is its own change, with its own CI
        # evidence, and it does not belong in a commit that fixes an installer
        # which was lying about the result.
        # **And `ubuntu-24.04-arm` for `aarch64-unknown-linux-gnu`**, on the
        # same Ubuntu 24.04 and so the same glibc 2.39: one `MIN_GLIBC` holds
        # for both Linux archives. GitHub's arm64 Linux runners are free for
        # public repositories. `install.sh` already maps `aarch64` to this
        # triple; this is what makes the asset it asks for exist.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      # The tag is pushed before the draft is created. Both draft-release
      # events and manual dispatches must build that immutable ref, never the
      # branch selected in the Actions UI or a movable target_commitish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned, not `stable`: see ci.yml
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.os }}

      - name: Cache the Windows LLVM tarball
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.llvm
          key: llvm-22.1.8-${{ runner.os }}

      # The same script a contributor runs, for the reason `ci.yml` gives: a
      # failure here should be a failure of the documented install rather than
      # of a path that only exists in CI.
      - name: Install LLVM and write the cargo config
        shell: bash
        run: |
          prefix=$(sh scripts/setup-llvm.sh --quiet)
          if [ -z "$prefix" ]; then echo "setup-llvm printed nothing"; exit 1; fi
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"

      # **macOS: `wasm-ld` is in Homebrew's `lld@22`, not `llvm@22`**, whose
      # formula builds without `lld`. The wasm check below links a module with
      # the packaged `khora`, which looks in the LLVM prefix and then on PATH,
      # so the leg needs LLVM 22's `wasm-ld` on PATH. The compiler refuses a
      # `wasm-ld` from another LLVM, so whatever the image already has cannot
      # stand in for it.
      - name: Put LLVM 22's wasm-ld on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --formula lld@22 >/dev/null 2>&1 || brew install lld@22
          echo "$(brew --prefix lld@22)/bin" >> "$GITHUB_PATH"

      # **Named for the tag, not the manifest.** A candidate is tagged
      # `v0.2.0-rc.1` while `Cargo.toml` still says `0.2.0`; the artifact has
      # to carry the tag's version or `install.sh`, which builds the filename
      # out of the tag it asked the API for, looks for a file nobody
      # published. The same string reaches `khora --version`.
      - name: Package
        shell: bash
        run: sh scripts/package.sh --version "${TAG#v}"

      # **The WebAssembly runtime is in the archive, and found there.** Read
      # from the published file itself, then used: the packaged `khora` builds
      # a `--lib` for `wasm32-unknown-unknown` with nothing set. Every test in
      # the repository finds that runtime in the cargo target directory, so
      # only this can tell whether the archive carries it. A `.zip` is checked
      # by its listing; the build half runs on the three `.tar.gz` runners.
      # **What it does not prove is a user's `wasm-ld`**: the compiler looks
      # in the LLVM prefix baked in at build time, then on PATH, and requires
      # LLVM 22's. The Linux runners have it in the prefix (apt.llvm.org's
      # `lld`); macOS gets it on PATH from `lld@22` (above); the Windows
      # `.zip` is checked by listing only and links nothing.
      #
      # **The bundle is found by a loop, not `ls | head`.** Each runner makes
      # one bundle, so one of the two globs never matches, and under this
      # shell's `-o pipefail` the failing `ls` ended the step before anything
      # was checked -- on every runner, so `attach` published nothing.
      - name: The archive builds for wasm32-unknown-unknown
        shell: bash
        run: |
          set -eu
          bundle=
          for candidate in dist/khora-*.tar.gz dist/khora-*.zip; do
            if [ -e "$candidate" ]; then bundle=$candidate; break; fi
          done
          if [ -z "$bundle" ]; then
            echo "no dist/khora-*.tar.gz or dist/khora-*.zip to check; did Package run?" >&2
            exit 1
          fi
          sh scripts/check-package-layout.sh "$bundle"

      # **The artifact is used before it is published**, and this is the only
      # place that can happen. Every test inside the repository finds `std/`
      # and the runtime archive in the tree; none of them can tell whether a
      # toolchain that has been unpacked somewhere else finds them beside its
      # own binary. A release that unpacks and cannot compile is the one
      # failure a release must not have.
      - name: Compile something with what was packaged
        shell: bash
        run: |
          set -eu
          name=$(cd dist && ls -d khora-*/ | head -1)
          name=${name%/}

          mkdir -p "$RUNNER_TEMP/first/src"
          # **The manifest a 0.2.0 toolchain requires, not a 0.1.0 one.**
          #
          # `[toolchain] version` became required in 0.2.0 and `edition` was
          # removed, and this step still wrote the old shape -- so the first
          # release to enforce its own rule failed its own smoke test on all
          # three platforms, with the compiler correctly refusing a manifest
          # the workflow had just written. The check was testing a language
          # that no longer existed.
          #
          # The pin is the version being released, taken from the tag rather
          # than written here: a literal would be one more place to forget at
          # the next bump. `TAG` is what the package step was given, so the
          # pin and the archive cannot disagree.
          #
          # `${TAG#v}` and not a parse of the directory name: a candidate's
          # version contains a hyphen of its own -- `0.2.0-rc.1` -- so
          # trimming `khora-<version>-<triple>` at a hyphen gets it wrong in
          # exactly the case a candidate exists to test.
          cat > "$RUNNER_TEMP/first/khora.toml" <<EOF
          [package]
          name = "first"
          version = "0.1.0"

          [toolchain]
          version = "${TAG#v}"
          EOF
          cat > "$RUNNER_TEMP/first/src/main.kh" <<'EOF'
          module main;
          import std::core::{print};
          fn main() -> Int { print("a packaged toolchain works"); 0 }
          EOF

          cd "$RUNNER_TEMP/first"
          # No KHORA_STD, no KHORA_RT_LIB. If the layout is wrong, here is
          # where it shows.
          "$GITHUB_WORKSPACE/dist/$name/bin/khora" build .

          # **The binary is `build/<package>`, and this step looked for
          # `src/main`.** It had done since before a build got an output
          # directory of its own, and nothing noticed, because the step's last
          # command was the only thing here that could fail and it failed
          # identically whether the toolchain was broken or the path was
          # stale. It was the path: the packaged compiler built
          # `build/first.exe`, the check ran `./src/main`, exit 127, and three
          # platforms went red on a release whose toolchain was fine.
          #
          # So a miss now prints what the build actually produced rather than
          # a shell's file-not-found, and the run is checked against what the
          # program was supposed to say -- a step that only asserts "exited 0"
          # passes for a program that printed nothing.
          built=build/first
          if [ -f "$built.exe" ]; then built="$built.exe"; fi
          if [ ! -f "$built" ]; then
            echo "No executable at build/first. What the build produced:"
            find . -type f -not -path './src/*' | sed 's/^/  /'
            exit 1
          fi

          # Run it directly rather than through `khora run`: what has to be
          # proven is that the *produced binary* stands on its own, linked
          # against the runtime and needing no toolchain on the path, which is
          # what somebody shipping one gets. `tr` because a Windows runner
          # ends the line with a carriage return, and a comparison that fails
          # on the invisible half of a string is a bad afternoon.
          said=$("./$built" | tr -d '\r')
          echo "$said"
          if [ "$said" != "a packaged toolchain works" ]; then
            echo "The program ran, and said something else."
            exit 1
          fi

          # **And a static one, on each Linux runner.** What this proves is
          # the *package's* half: `--target <arch>-unknown-linux-musl` must
          # find the runtime and the C library in the archive's `targets/`,
          # not in the Rust toolchain this runner has, so `PATH` is cut down to
          # the system's and `rustc` is not on it. What it does **not** prove
          # is the link tools: the compiler bakes in the `LLVM_SYS_221_PREFIX`
          # it was built with and looks there for clang and `ld.lld` first,
          # and on this runner that prefix exists, so the pinned LLVM drives
          # the link rather than whatever a user's machine has. The
          # cross-architecture link, the one that needs `ld.lld`, is not run
          # here at all. The result is run with an empty environment, and
          # checked for what a dynamic executable has and a static one does
          # not: a loader (`PT_INTERP`) or a shared library (`NEEDED`). A
          # static PIE has a dynamic section of its own relocations, so
          # `DYNAMIC` alone is not the test.
          if [ "$RUNNER_OS" = "Linux" ]; then
            musl="$(uname -m)-unknown-linux-musl"
            PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/$name/bin/khora" build . \
              --target "$musl" -o static-first
            file static-first
            if readelf -l static-first | grep -q INTERP || readelf -d static-first | grep -q NEEDED; then
              echo "The $musl build is not static:"
              readelf -l -d static-first
              exit 1
            fi
            said=$(env -i ./static-first)
            if [ "$said" != "a packaged toolchain works" ]; then
              echo "The static program ran, and said: $said"
              exit 1
            fi
            echo "static $musl: $said"
          fi

      # **One platform, because the answer is the same on all of them.** The
      # bill of materials comes from `cargo metadata --locked`, which reads
      # `Cargo.lock`, and the lockfile does not vary by runner. Producing it
      # three times would attach three identical files under one name and
      # invite the question of which one is authoritative.
      - name: Bill of materials for the toolchain
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -eu
          python3 scripts/toolchain-sbom.py > "dist/khora-${TAG#v}.cdx.json"
          # It is a release artifact, so it gets a checksum like the others.
          ( cd dist && sha256sum "khora-${TAG#v}.cdx.json" > "khora-${TAG#v}.cdx.json.sha256" )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khora-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error

  # **The toolchain for Alpine, built in Alpine.** A musl `khora` needs LLVM's
  # libraries built for musl; LLVM publishes none and Alpine ships them, so the
  # build runs in an `alpine` image (`scripts/build-alpine.sh` says what that
  # costs). Run with `docker run` rather than `container:` because GitHub's
  # arm64 runners do not run JavaScript actions inside a job container, and
  # `checkout` and `upload-artifact` are both JavaScript.
  #
  # **Smoke-tested in a second, clean `alpine` container** with nothing in it
  # but `clang` and `lld`: `install.sh` from the built archive, then `new`,
  # `build` and run, `check`, `fmt`, `test` on `examples/khq`, `run`, the
  # language server reporting a type error in a file it is given, and a
  # `--lib` linked into a C program and opened with `dlopen` --
  # `scripts/alpine-smoke.sh`.
  #
  # `workflow_dispatch` with `alpine-only` runs this and nothing else, from any
  # branch, so it can be tried before a candidate is tagged.
  alpine:
    name: package (alpine, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # By digest, the multi-architecture index, so each runner pulls its own
      # architecture's image of exactly this one. A tag moves: `3.24` is
      # re-pushed for every point release and security rebuild, and a
      # release's Alpine archive would be built from whichever was current
      # that day. Moving it is a deliberate edit, with the date it was read.
      # alpine:3.24, read from Docker Hub on 2026-11-05.
      ALPINE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # On a dispatch with `alpine-only`, the branch the run was started from;
      # otherwise the tag, for the reason the `build` job gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.alpine-only && github.ref || github.event.release.tag_name || inputs.tag }}

      # Seconds, and before the build: an installer that sends Alpine to the
      # glibc archive makes everything below unreachable for a user.
      - name: install.sh picks the build for the C library
        run: sh scripts/check-install-target.sh

      # Cargo's registry, rustup and the target directory, kept between runs.
      # They are written by root inside the container, so the cache is taken
      # from a directory the runner owns rather than from `~/.cargo`.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/alpine-cache
          key: alpine-3.24-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-3.24-${{ matrix.arch }}-

      - name: Build and package in Alpine
        run: |
          set -eu
          cache="$RUNNER_TEMP/alpine-cache"
          mkdir -p "$cache/cargo" "$cache/rustup" "$cache/target"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$cache/cargo:/cache/cargo" -v "$cache/rustup:/cache/rustup" \
            -v "$cache/target:/cache/target" \
            -e CARGO_HOME=/cache/cargo -e RUSTUP_HOME=/cache/rustup \
            -e CARGO_TARGET_DIR=/cache/target \
            "$ALPINE" sh scripts/build-alpine.sh "${TAG#v}"
          # Root wrote these; the runner has to be able to read and cache them.
          sudo chown -R "$(id -u):$(id -g)" dist "$cache"
          ls -l dist

      - name: The compiler is one static executable
        run: |
          set -eu
          name="khora-${TAG#v}-${{ matrix.arch }}-unknown-linux-musl"
          tar xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/$name/bin/khora"
          file "$bin"
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "The Alpine khora needs shared libraries:"
            readelf -d "$bin" | grep NEEDED
            exit 1
          fi
          # Outside the checkout: its `khora.toml` pins the version in
          # `Cargo.toml`, and a candidate's `khora` is stamped with the tag's,
          # so in the checkout it refuses with "this project pins Khora X".
          cd "$RUNNER_TEMP"
          "$bin" --version

      - name: Install and use it in a clean Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$ALPINE" \
            sh scripts/alpine-smoke.sh "${TAG#v}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khora-alpine-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error

  attach:
    name: attach to ${{ github.event.release.tag_name || inputs.tag }}
    # The one job that writes, and the only one with a token that can.
    permissions:
      contents: write
      # **What signing is, here.** There is no key to keep: the attestation
      # below is signed by GitHub's OIDC identity for this workflow in this
      # repository, and `gh attestation verify` checks a downloaded file
      # against it. That is the equivalent appropriate to this release
      # infrastructure -- a maintainer's key on a workstation would move the
      # root of trust back to a laptop, which the build job deliberately does
      # not do.
      id-token: write
      attestations: write
    # **Every archive, or none.** The Alpine jobs are as much a gate as the
    # others: `install.sh` sends every musl machine to the musl archive, so a
    # release that attached the glibc and macOS ones without it would be one
    # Alpine cannot install. A red Alpine job stops the release; see README's
    # "Cutting one".
    needs: [build, alpine]
    if: ${{ !inputs.alpine-only }}
    runs-on: ubuntu-latest
    steps:
      # Release notes and attestations must describe the same tagged source
      # as the three package jobs, including on workflow_dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: What is about to be attached
        run: ls -l artifacts

      # Provenance for the archives, not for the checksum files: a `.sha256` is
      # a claim *about* an artifact and is verified by recomputing it, so
      # attesting it separately would say nothing the archive's own attestation
      # does not.
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.cdx.json

      # `gh` is on every runner. `--clobber` so that re-running after a fixed
      # build replaces the file rather than failing on a name that is already
      # there — which is the difference between a release you can iterate on
      # and one you have to delete and remake.
      #
      # The release is *not* created here if it is missing: this workflow
      # attaches to a decision somebody already made, and a run against a typo
      # in a tag should say so rather than quietly produce a second release.
      # **Notes, checksums and provenance are published together or not at
      # all**, which is the whole point of doing this in the job that uploads.
      # The notes are cut from `CHANGELOG.md` rather than written twice, and a
      # version with no entry stops the release here rather than shipping a
      # blank body.
      - name: Release notes, from the changelog
        run: sh scripts/release-notes.sh "${TAG#v}" > release-notes.md

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "No release tagged $TAG."
            echo "Create it on GitHub first — as a draft — then run this."
            exit 1
          fi
          gh release upload "$TAG" artifacts/* --clobber

          # Only when nobody has written a body. A draft somebody has already
          # edited is a decision, and overwriting it with the changelog would
          # discard it silently.
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file release-notes.md
            echo "Notes set from CHANGELOG.md."
          else
            echo "The release already has a body, so the changelog notes were not applied."
            echo "They are in release-notes.md on this run if you want them."
          fi
          echo
          echo "Attached to $TAG. It is still a draft until somebody publishes it,"
          echo "and only publishing makes it the release install.sh will find."
          echo
          echo "Every archive is attested. A downloader checks one with:"
          echo "  gh attestation verify <file> --repo $GH_REPO"

  # **The documentation tree is part of the release, and was not.**
  #
  # Cutting `v0.1.0` left `/docs/` pointing at it while `khora --version` said
  # `0.2.0` and `/docs/v0.2/` was a 404, because the step that copies the pages
  # existed only as a comment in `versions.mjs` telling a maintainer to run two
  # `git` commands. A newcomer reads that skew as "my compiler is ahead of its
  # documentation" and starts discounting pages that are correct.
  #
  # This job does not push to `main`. It pushes a branch for maintainer review
  # because the cut is a real change to the site -- a tree and a `versions.mjs`
  # entry. A maintainer opens and merges the PR; this job does not open it.
  # Candidates keep their pages under /docs/next/. Cutting their tree as
  # stable would redirect ordinary readers to a compiler only available with
  # --pre, and the final tag would collide with the same v0.4 destination.
  # The repository disables PR creation by GitHub Actions; this job pushes a
  # branch for an authenticated maintainer to open and merge as a separate step.
  docs:
    name: prepare stable documentation tree
    if: ${{ !inputs.alpine-only && !contains(github.event.release.tag_name || inputs.tag, '-rc.') }}
    needs: attach
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # `cut-docs.sh` reads the tag with `git archive`, so the tag has to be
          # here: a shallow default checkout has the commit and not the refs.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Cut it from the tag
        run: sh scripts/cut-docs.sh "$TAG"

      - name: The site still builds with the new tree
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Push documentation branch for maintainer review
        run: |
          set -eu
          branch="docs/cut-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add website/content/versions website/versions.mjs
          git commit -m "Documentation for $TAG, cut from the tag"
          git push origin "$branch"
          printf 'Open and merge a PR from `%s` to `main` with an authenticated maintainer account. GitHub Actions cannot create PRs in this repository.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
