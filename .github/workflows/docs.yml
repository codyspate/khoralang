name: Documentation site

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # **The same two checks `baseline.sh` runs, from the other direction.**
  #
  # `ci.yml` ignores `website/**` because a prose change should not start six
  # runners and cancel a real run. But two of `baseline.sh`'s steps are about
  # this tree, and the coverage has to exist on both sides -- they catch
  # opposite failures:
  #
  #   - a **code** change that breaks the site (`std`'s `///` comments edited,
  #     so the generated pages go stale; syntax removed, so an example in the
  #     prose no longer parses) is caught by `baseline.sh`, which `ci.yml`
  #     still runs for every change outside `website/`;
  #   - a **prose** change that breaks itself (a hand-written example with a
  #     typo, a generated page edited by hand) is caught here, and would
  #     otherwise reach `main` unchecked now that `ci.yml` skips it.
  #
  # So this is deliberately the same two commands, not a move. Neither needs
  # the LLVM backend -- they parse and check, they do not build -- so the job
  # is a few minutes rather than another `backend`.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: docs-prose
      - name: Build the CLI, without the backend
        run: cargo build -p khora-cli
      - name: The examples in the prose still compile
        run: bash scripts/check-docs.sh
      - name: The generated reference matches the standard library
        run: ./target/debug/khora doc std --out website/content/docs/stdlib/api --check
      # **`--check` above compares the page to its source; this compiles what
      # the page says.** The two agree perfectly about an example that does not
      # build, which is how `std::fs`'s `read_text` example was published using
      # `IoError` without importing it -- and copied verbatim, by somebody
      # reading the page to learn the library.
      - name: The programs on the generated pages still compile
        run: KHORA=./target/debug/khora bash scripts/check-api-programs.sh
      # **A correction only counts where readers are.** `/docs/` redirects into
      # the newest stable tree, so a fix written in `next` is invisible to
      # everybody who did not ask for `next` by name. A trial reported the
      # `std::db` claim, it was corrected in `next`, and the next trial read the
      # published tree and lost the same twenty minutes to the same sentence.
      - name: Corrections reach the tree `/docs/` serves
        run: bash scripts/check-corrections.sh

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production-docs
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
