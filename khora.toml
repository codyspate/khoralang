# The workspace this repository is.
#
# **No `[package]`, because the root is not one.** `std`, four examples, four
# benchmarks and a library live under it, and none of them is here. A root
# forced to declare a package would be inventing a name for a thing that does
# not exist, and that name would then turn up in error messages. Roadmap 14.13.
#
# What this buys, concretely: `khora check .` at the root checks every member,
# each as its own package with its own dependencies. `scripts/baseline.sh` used
# to do that with a `for` loop and a comment explaining why the loop was
# necessary.
#
# `std` is not a member. It is found beside the compiler rather than resolved
# through a manifest -- `khora_db::standard_library` -- and it has no
# `khora.toml` at all, which is the same reason `khora check std` is still its
# own line in the baseline.

[workspace]
members = ["examples/*", "packages/*", "bench/*"]

# What every member takes with `field.workspace = true`. Roadmap 14.14.
#
# Nothing is inherited implicitly: a member that wants the shared version says
# so. The alternative -- a root value that applies unless overridden -- means
# reading a member's manifest tells you what it *adds*, and the only way to
# know what it *is* is to read two files and remember which wins.
[workspace.package]
version = "0.1.0"
edition = "2026"

# The formatter, in one place.
#
# This block was copied into three of the four examples verbatim, which is the
# argument for the feature in miniature: three copies of a decision that was
# only ever made once, and nothing to notice when one of them drifts.
[workspace.fmt]
indent-style = "space"
indent-width = 2

# A cap on what any member may ask for. Roadmap 14.19.
#
# **Not the same table as `[workspace.permissions]`.** That one is a default a
# member opts into with `workspace = true`; this is a cap a member cannot opt
# out of. Only the three examples that answer on a port may reach the network,
# and a fourth one that decides to is a build failure rather than something a
# reviewer has to notice.
#
# `extern = []` is the strict one and the one that matters most: nothing here
# may declare an `extern fn` or hand that permission to a dependency. `std`
# always may, which is the design rather than an exception to it -- everything
# leaving Khora goes through functions whose signatures carry capability rows,
# and those live in `std`. `docs/design/permissions.md`.
[workspace.policy]
network = ["ledger_service", "link_shortener", "risk_analyzer"]
env = ["ledger_service", "link_shortener", "risk_analyzer"]
fs = ["link_shortener", "risk_analyzer"]
extern = []

# What somebody runs before pushing. Roadmap 14.18.
#
# Declared at the root, so it runs once here rather than eight times, one per
# member: `ci` in a monorepo means "run the pipeline", not "run something
# called ci in each package".
[tasks.ci]
description = "The full baseline: clippy, tests, the corpus, the conformance suite"
run = "bash scripts/baseline.sh"

[tasks.docs]
description = "Regenerate the standard library reference"
run = "khora doc"
