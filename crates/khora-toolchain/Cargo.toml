[package]
name = "khora-toolchain"
description = "Several Khora versions on one machine, and which one a project wants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
khora-manifest.workspace = true
anyhow.workspace = true
# For verifying a download against its published checksum. Already in the tree
# for the package store, so this adds nothing to the dependency graph.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
