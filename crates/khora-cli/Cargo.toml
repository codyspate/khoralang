[package]
name = "khora-cli"
description = "The `khora` toolchain driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "khora"
path = "src/main.rs"

[dependencies]
khora-syntax.workspace = true
khora-db.workspace = true
khora-lint.workspace = true
khora-doc.workspace = true
khora-lsp.workspace = true
khora-mcp.workspace = true
khora-manifest.workspace = true
khora-pkg.workspace = true
khora-toolchain.workspace = true
khora-fmt.workspace = true
khora-diagnostics.workspace = true
khora-types.workspace = true
khora-codegen-llvm.workspace = true
khora-hir.workspace = true
anyhow.workspace = true
clap.workspace = true

[features]
# `khora build` needs the LLVM backend; everything else works without it.
default = []
llvm = ["khora-codegen-llvm/llvm"]

[dev-dependencies]
khora-manifest.workspace = true
tempfile = "3"
