[package]
name = "khora-rt"
description = "The Khora runtime: reference-counted allocation and intrinsics, linked into every executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# TLS is bound rather than written — `docs/design/ecosystem.md`. `ring` rather
# than the default provider because it needs no cmake and no assembler, so a
# Khora checkout builds with a Rust toolchain and clang and nothing else.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# The machine's own trust store, rather than a root list compiled in here. A
# client that ignores what its machine trusts is wrong wherever there is a
# corporate CA, and a bundled list ages silently between releases.
rustls-native-certs = "0.8"
# The context switch. Three targets of assembly, of which this machine can run
# one; on Windows a switch has to keep the thread environment block's stack
# bounds in step or structured exception handling and the guard page check
# against the wrong stack. `crates/khora-rt/src/coro.rs` has the reasoning, and
# the `Stack` trait leaves the allocation strategy in `docs/design/scheduler.md`
# ours to implement.
corosensei = "0.3"

# The reactor's one platform-specific call. Both are already in the tree
# through `rustls-native-certs`, so naming them here costs no build time and
# buys not hand-declaring a struct whose width differs per platform.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
# Linked into generated executables by clang, so it must be a static archive
# exposing a C ABI.
crate-type = ["staticlib", "rlib"]
