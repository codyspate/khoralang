[workspace]
resolver = "2"
members = [
    "crates/khora-syntax",
    "crates/khora-db",
    "crates/khora-fmt",
    "crates/khora-diagnostics",
    "crates/khora-hir",
    "crates/khora-types",
    "crates/khora-perceus",
    "crates/khora-rt",
    "crates/khora-codegen-llvm",
    "crates/khora-manifest",
    "crates/khora-lint",
    "crates/khora-lsp",
    "crates/khora-pkg",
    "crates/khora-toolchain",
    "crates/khora-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# salsa 0.28 requires 1.85, so anything lower was never buildable.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/khora-lang/khora"

[workspace.dependencies]
khora-syntax = { path = "crates/khora-syntax" }
khora-db = { path = "crates/khora-db" }
khora-fmt = { path = "crates/khora-fmt" }
khora-diagnostics = { path = "crates/khora-diagnostics" }
khora-hir = { path = "crates/khora-hir" }
khora-types = { path = "crates/khora-types" }
khora-perceus = { path = "crates/khora-perceus" }
khora-rt = { path = "crates/khora-rt" }
khora-codegen-llvm = { path = "crates/khora-codegen-llvm" }
khora-manifest = { path = "crates/khora-manifest" }
khora-lint = { path = "crates/khora-lint" }
khora-lsp = { path = "crates/khora-lsp" }
khora-pkg = { path = "crates/khora-pkg" }
khora-toolchain = { path = "crates/khora-toolchain" }

salsa = "0.28"
logos = "0.15"
rowan = "0.17"
text-size = "1.1"
rustc-hash = "2"
smol_str = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The runtime is not part of the compiler; it is part of what the compiler
# *ships*. Every Khora program links it, so building it unoptimised because
# `cargo build` was run without `--release` puts a debug `khora_alloc`,
# `khora_drop` and `khora_str_find` inside somebody's release executable —
# `toolchain::runtime_archive` looks beside the running `khora`, and beside a
# `target/debug/khora.exe` is `target/debug/khora_rt.lib`.
#
# Measured, on parsing an eighty-byte HTTP request: 9,000 nanoseconds against
# 3,650. Two and a half times, on every program, from a profile setting.
#
# Overflow checks stay on. They are the runtime's own bounds discipline rather
# than a debugging aid, and `opt-level = 3` is what was actually missing.
# Test binaries carry line tables rather than full debug information.
#
# There are thirty integration test binaries and each links the whole compiler
# and LLVM, so writing complete PDBs for all of them is a third of the time it
# takes to get from an edit to a result: 25.5 seconds to link them all, against
# 17.7 with this.
#
# `[profile.test]` and not `[profile.dev]`, so `cargo build -p khora-cli` — the
# binary anybody would actually attach a debugger to — is untouched. A panic in
# a test still reports its file and line, which is what a test failure needs;
# what is given up is inspecting locals in a debugger *inside a test*, and the
# way to get that back for one session is `--profile dev`.
[profile.test]
debug = "line-tables-only"

[profile.dev.package.khora-rt]
opt-level = 3
